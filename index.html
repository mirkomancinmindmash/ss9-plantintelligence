<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SS9 Plant Intelligence — Caseificio dimostrativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#E7E4E5; --bg2:#F0EDEE; --panel:#F7F6F6; --panel2:#ECE9EA; --line:#D0D1D3; --line2:#BDBFC2;
  --text:#101D20; --text2:#344A51; --muted:#61747A;
  --accent:#00A3A3; --accent-hover:#00B8B8; --accent-press:#008C8C; --accent-soft:rgba(0,163,163,.13); --on-accent:#FFFFFF;
  --ok:#2C9A6E; --warn:#D9861A; --crit:#D23C43; --info:#5C7C86;
  --stage-hi:#F2F0F1; --ground:#DEDADB; --grid:rgba(16,29,32,.05); --slab-t:#CFCBCC; --slab-l:#B9B5B6; --slab-r:#A9A4A6;
  --floor:#ECEAEA; --floor-hi:#FBFAFA; --floor-edge:rgba(16,29,32,.16); --yard:#D3CFD0; --lane:rgba(16,29,32,.25);
  --wall-t:#F4F5F5; --wall-l:#C9CFD1; --wall-r:#B3BBBE; --edge:rgba(16,29,32,.14);
  --steel-t:#EEF1F2; --steel-l:#BCC6C9; --steel-r:#9AA8AC;
  --white-t:#FFFFFF; --white-l:#DCE1E2; --white-r:#C5CDCF;
  --dark-t:#62737A; --dark-l:#43545A; --dark-r:#33434A;
  --panel-t:#FAFBFB; --panel-l:#DCE2E4; --panel-r:#C6CED1;
  --mach-t:#A7B8C3; --mach-l:#8498A6; --mach-r:#6C7F8E;
  --boiler-t:#E6DFD9; --boiler-l:#CCC2BA; --boiler-r:#B5AAA1;
  --shelf-t:#C7A472; --shelf-l:#A5834F; --shelf-r:#8E6E3F; --cheese:#E9C77B;
  --brine:#A8DDE3; --milk:#FFFDF4; --water:#86C7E8; --dial:#FBFAF7;
  --flow-milk:#E8DFC4; --flow-steam:#E4874C; --flow-glycol:#2FA9C0; --flow-air:#8195A0; --flow-water:#2F86C9; --pipe:rgba(16,29,32,.18);
  --hud:rgba(247,246,246,.88); --hud-strong:rgba(250,249,249,.96); --label-bg:rgba(250,249,249,.94);
  --shadow:0 14px 40px rgba(16,29,32,.16); --shadow-sm:0 4px 14px rgba(16,29,32,.10);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme: dark;
  --bg:#101D20; --bg2:#0F1C21; --panel:#13242A; --panel2:#172B33; --line:#213C47; --line2:#2F4E5A;
  --text:#F0EDEE; --text2:#BFC9CC; --muted:#84979D;
  --accent:#00CCCC; --accent-hover:#00E3E3; --accent-press:#00ABAB; --accent-soft:rgba(0,204,204,.14); --on-accent:#101D20;
  --ok:#3FC48F; --warn:#F2A93B; --crit:#F0565B; --info:#7FA0AA;
  --stage-hi:#173038; --ground:#0D1A1D; --grid:rgba(0,204,204,.05); --slab-t:#1C343C; --slab-l:#142A31; --slab-r:#0F2228;
  --floor:#1A333B; --floor-hi:#22434D; --floor-edge:rgba(0,204,204,.16); --yard:#16292F; --lane:rgba(240,237,238,.2);
  --wall-t:#4A6F7C; --wall-l:#2A4A55; --wall-r:#203D47; --edge:rgba(0,0,0,.32);
  --steel-t:#A3B6BC; --steel-l:#6D848C; --steel-r:#50666E;
  --white-t:#D9E2E4; --white-l:#A3B3B7; --white-r:#83969B;
  --dark-t:#3F555D; --dark-l:#2C3F46; --dark-r:#213239;
  --panel-t:#C6D3D6; --panel-l:#8EA2A7; --panel-r:#71878D;
  --mach-t:#5D7C8D; --mach-l:#466272; --mach-r:#364E5C;
  --boiler-t:#9A8F86; --boiler-l:#766C64; --boiler-r:#5F5650;
  --shelf-t:#B48F58; --shelf-l:#86683A; --shelf-r:#6C532D; --cheese:#D9B467;
  --brine:#5FB6C2; --milk:#F3EEDF; --water:#3F9ACB; --dial:#F4F2EC;
  --flow-milk:#EDE3C4; --flow-steam:#F08A4B; --flow-glycol:#36C2D9; --flow-air:#A9BCC6; --flow-water:#4FA3E8; --pipe:rgba(0,0,0,.35);
  --hud:rgba(19,36,42,.86); --hud-strong:rgba(19,36,42,.97); --label-bg:rgba(16,29,32,.92);
  --shadow:0 16px 44px rgba(0,0,0,.5); --shadow-sm:0 4px 16px rgba(0,0,0,.35); } }
:root[data-theme="dark"]{ color-scheme: dark;
  --bg:#101D20; --bg2:#0F1C21; --panel:#13242A; --panel2:#172B33; --line:#213C47; --line2:#2F4E5A;
  --text:#F0EDEE; --text2:#BFC9CC; --muted:#84979D;
  --accent:#00CCCC; --accent-hover:#00E3E3; --accent-press:#00ABAB; --accent-soft:rgba(0,204,204,.14); --on-accent:#101D20;
  --ok:#3FC48F; --warn:#F2A93B; --crit:#F0565B; --info:#7FA0AA;
  --stage-hi:#173038; --ground:#0D1A1D; --grid:rgba(0,204,204,.05); --slab-t:#1C343C; --slab-l:#142A31; --slab-r:#0F2228;
  --floor:#1A333B; --floor-hi:#22434D; --floor-edge:rgba(0,204,204,.16); --yard:#16292F; --lane:rgba(240,237,238,.2);
  --wall-t:#4A6F7C; --wall-l:#2A4A55; --wall-r:#203D47; --edge:rgba(0,0,0,.32);
  --steel-t:#A3B6BC; --steel-l:#6D848C; --steel-r:#50666E;
  --white-t:#D9E2E4; --white-l:#A3B3B7; --white-r:#83969B;
  --dark-t:#3F555D; --dark-l:#2C3F46; --dark-r:#213239;
  --panel-t:#C6D3D6; --panel-l:#8EA2A7; --panel-r:#71878D;
  --mach-t:#5D7C8D; --mach-l:#466272; --mach-r:#364E5C;
  --boiler-t:#9A8F86; --boiler-l:#766C64; --boiler-r:#5F5650;
  --shelf-t:#B48F58; --shelf-l:#86683A; --shelf-r:#6C532D; --cheese:#D9B467;
  --brine:#5FB6C2; --milk:#F3EEDF; --water:#3F9ACB; --dial:#F4F2EC;
  --flow-milk:#EDE3C4; --flow-steam:#F08A4B; --flow-glycol:#36C2D9; --flow-air:#A9BCC6; --flow-water:#4FA3E8; --pipe:rgba(0,0,0,.35);
  --hud:rgba(19,36,42,.86); --hud-strong:rgba(19,36,42,.97); --label-bg:rgba(16,29,32,.92);
  --shadow:0 16px 44px rgba(0,0,0,.5); --shadow-sm:0 4px 16px rgba(0,0,0,.35); }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; height:100%; background:var(--bg); color:var(--text); font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; }
#root{ height:100%; }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.ic{ flex:none; display:block; }

/* ---------- Welcome ---------- */
.welcome{ position:relative; height:100%; min-height:560px; overflow:hidden; background:radial-gradient(1100px 760px at 72% 46%, var(--stage-hi), var(--bg) 72%); }
.welcome-twin{ position:absolute; inset:0 0 0 30%; animation:breathe 26s ease-in-out infinite alternate; transform-origin:60% 50%; pointer-events:none; }
.welcome-twin svg{ width:100%; height:100%; display:block; }
@keyframes breathe{ from{ transform:scale(1) translate(0,0);} to{ transform:scale(1.06) translate(-1.5%,1%);} }
.welcome-veil{ position:absolute; inset:0; background:linear-gradient(90deg, var(--bg) 0%, var(--bg) 30%, color-mix(in srgb, var(--bg) 70%, transparent) 46%, transparent 64%); pointer-events:none; }
.welcome-copy{ position:relative; z-index:2; height:100%; display:flex; flex-direction:column; justify-content:center; padding:48px 6vw; max-width:640px; }
.welcome-logo{ height:132px; width:auto; color:var(--text); margin-bottom:34px; align-self:flex-start; }
.welcome-product{ font-family:'Audiowide',sans-serif; font-size:16px; color:var(--accent); margin:0 0 14px; }
.welcome h1{ font-weight:900; font-size:clamp(38px,4.6vw,64px); line-height:1.02; letter-spacing:-.015em; margin:0 0 18px; }
.welcome-sub{ font-size:clamp(17px,1.5vw,21px); font-weight:300; color:var(--text2); margin:0 0 34px; max-width:30ch; line-height:1.35; }
.welcome-actions{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:28px; }
.welcome-actions .btn{ font-size:15px; padding:13px 24px; }
.welcome-facts{ color:var(--muted); font-size:13.5px; max-width:44ch; margin:0 0 14px; }

/* ---------- Comuni ---------- */
.btn{ font-weight:600; font-size:13px; border-radius:999px; padding:8px 16px; border:1px solid transparent; cursor:pointer; display:inline-flex; align-items:center; gap:8px; white-space:nowrap; transition:background .15s, border-color .15s; }
.btn.primary{ background:var(--accent); color:var(--on-accent); }
.btn.primary:hover{ background:var(--accent-hover); }
.btn.primary:active{ background:var(--accent-press); }
.btn.ghost{ background:transparent; border-color:var(--line2); color:var(--text); }
.btn.ghost:hover{ background:var(--panel2); }
.btn.link{ background:none; color:var(--text2); padding:8px 6px; }
.btn.link:hover{ color:var(--text); }
.btn.sm{ padding:6px 12px; font-size:12.5px; }
.btn:disabled{ opacity:.4; cursor:default; }
.demo-badge{ display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--text2); border:1px dashed var(--line2); padding:5px 11px; border-radius:999px; white-space:nowrap; background:var(--panel); }
.demo-badge::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--warn); }
.dot{ width:9px; height:9px; border-radius:50%; flex:none; display:inline-block; background:var(--ok); }
.st-warn .dot, .dot.st-warn{ background:var(--warn); }
.st-crit .dot, .dot.st-crit{ background:var(--crit); }
.dot.st-info{ background:var(--info); }
.pill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--panel2); color:var(--text2); }
.pill.st-ok{ background:color-mix(in srgb,var(--ok) 15%,transparent); color:var(--ok); }
.pill.st-warn{ background:color-mix(in srgb,var(--warn) 17%,transparent); color:var(--warn); }
.pill.st-crit{ background:color-mix(in srgb,var(--crit) 17%,transparent); color:var(--crit); }

/* ---------- App ---------- */
.app{ display:grid; grid-template-rows:auto 1fr; height:100%; }
.topbar{ display:flex; align-items:center; gap:10px; padding:9px 16px; background:var(--bg2); border-bottom:1px solid var(--line); flex-wrap:wrap; position:relative; z-index:6; }
.brand{ display:flex; align-items:center; gap:10px; background:none; border:0; cursor:pointer; padding:3px 6px 3px 2px; border-radius:10px; }
.brand svg{ height:30px; width:auto; color:var(--text); }
.brand-name{ font-family:'Audiowide',sans-serif; font-size:15px; }
.plant{ display:flex; flex-direction:column; line-height:1.2; margin-right:auto; min-width:0; padding-left:12px; border-left:1px solid var(--line); }
.plant strong{ font-weight:600; font-size:14px; }
.plant span{ font-size:12px; color:var(--muted); }
.seg{ display:inline-flex; background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:3px; }
.seg button{ border:0; background:none; color:var(--text2); font-size:13px; font-weight:500; padding:6px 12px; border-radius:999px; cursor:pointer; white-space:nowrap; }
.seg button:hover{ color:var(--text); }
.seg button[aria-pressed="true"]{ background:var(--accent); color:var(--on-accent); }
.icon-btn{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--line); background:var(--panel); cursor:pointer; color:var(--text); }
.icon-btn:hover{ background:var(--panel2); }
.icon-btn[aria-pressed="true"]{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }

.main{ display:grid; grid-template-columns:minmax(0,1fr) 396px; min-height:0; }
.work{ position:relative; min-height:0; overflow:hidden; }
.stage{ position:absolute; inset:0; overflow:hidden; background:radial-gradient(1000px 680px at 52% 44%, var(--stage-hi), var(--bg) 74%); }
.main.full{ grid-template-columns:minmax(0,1fr); }
.tabs{ display:inline-flex; gap:2px; margin-left:6px; }
.tabs button{ white-space:nowrap; flex:none; border:0; background:none; font-size:14px; font-weight:600; color:var(--muted); padding:8px 12px; border-radius:10px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; position:relative; }
.tabs button:hover{ color:var(--text); background:var(--panel2); }
.tabs button[aria-current="page"]{ color:var(--text); }
.tabs button[aria-current="page"]::after{ content:""; position:absolute; left:12px; right:12px; bottom:-10px; height:3px; border-radius:2px; background:var(--accent); }
.work:not(.view-twin) .toasts{ top:auto; bottom:16px; left:auto; right:16px; transform:none; }
.work.view-assistant .toasts{ top:14px; bottom:auto; right:360px; }

/* ---------- Monitoraggio ---------- */
.dash-scroll{ position:absolute; inset:0; overflow:auto; container-type:inline-size; container-name:dash; }
.dash{ display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:14px; padding:20px 22px 32px; max-width:1560px; margin:0 auto; align-items:start; }
.c12{ grid-column:span 12; } .c7{ grid-column:span 7; } .c6{ grid-column:span 6; } .c5{ grid-column:span 5; } .c2{ grid-column:span 2; }
.dash-head{ display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; padding:2px 2px 0; }
.dash-head h1{ margin:0; font-size:27px; font-weight:800; letter-spacing:-.01em; line-height:1.1; }
.dash-head p{ margin:4px 0 0; color:var(--muted); font-size:13px; }
.dash-head .grow{ flex:1; }
.dcard{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 18px; min-width:0; }
.dcard h2{ font-size:15px; font-weight:700; margin:0 0 12px; display:flex; align-items:baseline; gap:8px; }
.dcard h2 .aside{ margin-left:auto; font-size:12px; font-weight:500; color:var(--muted); text-align:right; }
.tile{ padding:14px 16px 12px; display:flex; flex-direction:column; gap:1px; }
.tile small{ font-size:12px; color:var(--muted); }
.tile b{ font-size:23px; font-weight:700; line-height:1.2; white-space:nowrap; }
.tile b.wrap{ white-space:normal; font-size:17px; line-height:1.25; margin:3px 0 2px; }
.tile .u{ font-size:13px; font-weight:500; color:var(--muted); }
.tile .sub{ font-size:12px; color:var(--text2); line-height:1.3; }
.tile .sub.up{ color:var(--warn); }
.tile.st-warn{ border-color:color-mix(in srgb,var(--warn) 60%,var(--line)); }
.tile.st-crit{ border-color:color-mix(in srgb,var(--crit) 60%,var(--line)); }
.spark{ width:100%; display:block; margin-top:6px; overflow:visible; }
.spark .sl{ fill:none; stroke:var(--accent); stroke-width:1.6; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
.spark .sa{ fill:var(--accent); opacity:.12; }
.spark.st-warn .sl{ stroke:var(--warn); } .spark.st-warn .sa{ fill:var(--warn); }
.spark.st-crit .sl{ stroke:var(--crit); } .spark.st-crit .sa{ fill:var(--crit); }
.spark .sth{ stroke:var(--warn); stroke-width:1; stroke-dasharray:3 3; vector-effect:non-scaling-stroke; opacity:.75; }
.att{ display:flex; flex-direction:column; gap:10px; }
.att-item{ border:1px solid color-mix(in srgb,var(--warn) 50%,var(--line)); background:color-mix(in srgb,var(--warn) 6%,transparent); border-radius:12px; padding:12px 14px; }
.att-item.st-crit{ border-color:color-mix(in srgb,var(--crit) 55%,var(--line)); background:color-mix(in srgb,var(--crit) 6%,transparent); }
.att-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.att-top .meta{ font-size:12px; color:var(--muted); }
.att-item h3{ font-size:14px; font-weight:700; margin:6px 0 3px; line-height:1.3; }
.att-item p{ margin:0; font-size:12.5px; color:var(--text2); }
.att-foot{ display:flex; align-items:center; gap:10px; margin-top:8px; }
.att-foot .econ-s{ font-size:13px; font-weight:700; margin-right:auto; }
.att-sum{ margin:12px 0 0; font-size:13px; color:var(--text2); }
.ok-state{ display:flex; gap:12px; align-items:flex-start; padding:14px; border-radius:12px; background:color-mix(in srgb,var(--ok) 10%,transparent); color:var(--text2); font-size:13px; }
.ok-state .ic{ color:var(--ok); margin-top:1px; }
.ok-state b{ display:block; color:var(--text); font-size:14px; margin-bottom:2px; }
.dept-grid{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
.dept-card, .util-card, .mini{ text-align:left; background:var(--panel2); border:1px solid transparent; border-radius:12px; padding:11px 12px 10px; cursor:pointer; min-width:0; display:block; width:100%; }
.dept-card:hover, .util-card:hover, .mini:hover{ border-color:var(--line2); }
.dept-card.on, .util-card.on, .mini.on{ border-color:var(--accent); }
.dept-card.st-warn, .util-card.st-warn, .mini.st-warn{ border-color:color-mix(in srgb,var(--warn) 55%,transparent); background:color-mix(in srgb,var(--warn) 7%,var(--panel2)); }
.dept-card.st-crit, .util-card.st-crit, .mini.st-crit{ border-color:color-mix(in srgb,var(--crit) 55%,transparent); }
.dc-top{ display:flex; align-items:center; gap:7px; }
.dc-top .dn{ font-family:'Audiowide',sans-serif; font-size:11px; color:var(--accent); }
.dc-top b{ font-size:13px; font-weight:600; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dc-val{ margin-top:6px; }
.dc-val b{ font-size:19px; font-weight:700; }
.dc-val .u{ font-size:12px; color:var(--muted); }
.dc-val small{ display:block; font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dc-foot{ font-size:11.5px; color:var(--text2); margin-top:4px; }
.util-grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
.util-card{ padding:13px 14px 12px; }
.uc-h{ display:flex; align-items:center; gap:8px; }
.uc-h b{ font-size:14px; font-weight:700; flex:1; }
.util-card > small{ display:block; font-size:12px; color:var(--muted); margin-top:6px; }
.uc-v b{ font-size:22px; font-weight:700; }
.uc-v .u{ font-size:12.5px; color:var(--muted); }
.uc-rows{ margin-top:8px; display:flex; flex-direction:column; gap:3px; border-top:1px solid var(--line); padding-top:8px; }
.uc-rows span{ display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--text2); }
.uc-rows span b{ color:var(--text); font-weight:600; white-space:nowrap; }
.cold-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.mini small{ display:block; font-size:12px; color:var(--muted); line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mini b{ font-size:18px; font-weight:700; } .mini .u{ font-size:12px; color:var(--muted); }
.ebar{ display:grid; grid-template-columns:minmax(110px,1.1fr) 2fr 74px 50px 70px; gap:10px; align-items:center; font-size:12.5px; padding:5px 0; background:none; border:0; width:100%; text-align:left; cursor:pointer; color:var(--text2); }
.ebar:hover{ color:var(--text); }
.ebar .num{ text-align:right; color:var(--text); font-weight:600; }
.ebar .num.m{ color:var(--muted); font-weight:500; }
.ebar-h{ cursor:default; font-size:11.5px; color:var(--muted); border-bottom:1px solid var(--line); padding-bottom:7px; margin-bottom:3px; }
.ebar-h:hover{ color:var(--muted); }
.ebar-h .num{ color:var(--muted); font-weight:500; }
.tbl{ width:100%; border-collapse:collapse; font-size:13px; }
.tbl th{ text-align:left; font-weight:600; color:var(--muted); font-size:11.5px; padding:0 8px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
.tbl td{ padding:8px; border-bottom:1px solid var(--line); vertical-align:middle; }
.tbl tr:last-child td{ border-bottom:0; }
.tbl .num{ text-align:right; white-space:nowrap; }
.tbl .linkcell{ background:none; border:0; padding:0; cursor:pointer; text-align:left; font-weight:600; color:var(--text); }
.tbl .linkcell:hover{ color:var(--accent); }
.tbl .sub{ display:block; font-size:11.5px; color:var(--muted); font-weight:400; }
.runbar{ height:5px; background:var(--panel2); border-radius:3px; overflow:hidden; margin-top:4px; min-width:70px; }

.status-line{ display:flex; align-items:center; gap:8px; margin-top:10px; font-weight:600; font-size:13.5px; }
.kpis{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.kpi{ background:var(--panel2); border-radius:12px; padding:11px 12px; min-width:0; }
.kpi small{ display:block; font-size:12px; color:var(--muted); }
.kpi b{ display:block; font-size:21px; font-weight:700; line-height:1.2; margin:2px 0 1px; white-space:nowrap; }
.kpi b .u{ font-size:13px; font-weight:500; color:var(--muted); }
.kpi > span{ display:block; font-size:11.5px; color:var(--text2); line-height:1.3; }
.kpi > span.up{ color:var(--warn); }
.note{ font-size:11.5px; color:var(--muted); margin:10px 0 0; line-height:1.4; }
.bars{ display:flex; flex-direction:column; gap:7px; margin-top:4px; }
.bar-row{ display:grid; grid-template-columns:118px 1fr 64px; align-items:center; gap:8px; font-size:12.5px; background:none; border:0; padding:0; cursor:pointer; text-align:left; color:var(--text2); }
.bar-row:hover{ color:var(--text); }
.bar-track{ height:7px; border-radius:4px; background:var(--panel2); overflow:hidden; }
.bar-fill{ height:100%; border-radius:4px; background:var(--accent); opacity:.8; }
.bar-row .v{ text-align:right; font-weight:600; color:var(--text); }
.dlist{ display:flex; flex-direction:column; }
.drow{ display:grid; grid-template-columns:26px 1fr auto; align-items:center; gap:8px; padding:7px 8px; margin:0 -8px; border-radius:10px; border:0; background:none; cursor:pointer; text-align:left; }
.drow:hover, .drow.hov{ background:var(--panel2); }
.drow .n{ font-family:'Audiowide',sans-serif; font-size:11px; color:var(--accent); }
.drow .nm{ font-size:13.5px; font-weight:500; display:flex; align-items:center; gap:7px; min-width:0; }
.drow .nm span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.drow .v{ font-size:12.5px; color:var(--text2); white-space:nowrap; }
.drow.st-warn .v, .drow.st-crit .v{ color:var(--text); font-weight:600; }
.alist{ display:flex; flex-direction:column; gap:6px; }
.arow{ display:flex; gap:10px; align-items:flex-start; text-align:left; padding:10px 12px; border-radius:12px; border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line)); background:color-mix(in srgb,var(--warn) 7%,transparent); cursor:pointer; }
.arow.st-crit{ border-color:color-mix(in srgb,var(--crit) 50%,var(--line)); background:color-mix(in srgb,var(--crit) 7%,transparent); }
.arow b{ display:block; font-size:13px; line-height:1.3; }
.arow small{ font-size:12px; color:var(--muted); }
.arow .dot{ margin-top:4px; }
.waste{ display:flex; flex-direction:column; gap:6px; }
.waste-tot{ display:flex; align-items:baseline; gap:8px; }
.waste-tot b{ font-size:22px; font-weight:700; }
.waste-tot span{ color:var(--muted); font-size:12.5px; }
.waste-item{ font-size:12.5px; color:var(--text2); display:flex; justify-content:space-between; gap:10px; }
.empty{ font-size:13px; color:var(--text2); background:var(--panel2); border-radius:12px; padding:10px 12px; }
.fams{ display:flex; flex-wrap:wrap; gap:6px; }
.fam{ font-size:12px; padding:4px 10px; border-radius:999px; background:var(--panel2); color:var(--text2); cursor:help; }
.fam b{ font-weight:700; color:var(--text); margin-left:3px; }
.events{ list-style:none; margin:0; padding:0; }
.events li{ display:grid; grid-template-columns:62px 1fr; gap:8px; padding:7px 0; border-top:1px solid var(--line); font-size:12.5px; }
.events li:first-child{ border-top:0; }
.events time{ color:var(--muted); font-size:12px; }
.events b{ font-weight:600; display:flex; align-items:center; gap:6px; }
.events span{ color:var(--text2); display:block; }

.dhead{ display:flex; align-items:flex-start; gap:12px; }
.back{ display:inline-flex; align-items:center; gap:4px; font-size:12.5px; font-weight:600; color:var(--text2); background:none; border:0; cursor:pointer; padding:4px 8px 4px 2px; border-radius:8px; margin:-4px 0 10px -2px; }
.back:hover{ color:var(--text); }
.dnum{ font-family:'Audiowide',sans-serif; font-size:15px; color:var(--on-accent); background:var(--accent); width:40px; height:40px; border-radius:50%; display:grid; place-items:center; flex:none; }
.dhead h2{ margin:0; font-size:19px; font-weight:800; line-height:1.15; }
.dhead p{ margin:6px 0 0; color:var(--text2); font-size:13px; }
.dmeta{ display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
.alert-card{ border:1px solid color-mix(in srgb,var(--warn) 50%,var(--line)); background:color-mix(in srgb,var(--warn) 7%,var(--panel)); border-radius:14px; padding:14px; margin-bottom:10px; }
.alert-card.st-crit{ border-color:color-mix(in srgb,var(--crit) 55%,var(--line)); background:color-mix(in srgb,var(--crit) 7%,var(--panel)); }
.alert-card .ah{ display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
.alert-card h4{ margin:0 0 6px; font-size:15px; font-weight:700; line-height:1.25; }
.alert-card p{ margin:0 0 8px; font-size:13px; color:var(--text2); }
.alert-card .lbl{ font-size:12px; font-weight:700; color:var(--text); margin:10px 0 4px; }
.alert-card ul{ margin:0; padding-left:18px; font-size:13px; color:var(--text2); }
.alert-card .when{ font-size:12px; color:var(--muted); margin-left:auto; }
.econ{ margin-top:10px; padding:10px 12px; border-radius:10px; background:var(--panel); border:1px solid var(--line); }
.econ b{ font-size:18px; font-weight:700; }
.econ small{ display:block; font-size:12px; color:var(--muted); }
.econ code{ font-family:inherit; font-size:12.5px; color:var(--text); background:var(--panel2); padding:2px 6px; border-radius:6px; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ font-size:12.5px; font-weight:500; padding:5px 11px; border-radius:999px; border:1px solid var(--line); background:var(--panel); cursor:pointer; color:var(--text2); }
.chip:hover{ border-color:var(--line2); color:var(--text); }
.chip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.asset-info{ font-size:12.5px; color:var(--text2); margin:8px 0 0; }
.chart-card .ch{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:6px; }
.chart-card .ch small{ display:block; color:var(--muted); font-size:12px; }
.chart-card .ch strong{ font-size:14px; font-weight:600; line-height:1.25; display:block; }
.chart-card .cv{ text-align:right; white-space:nowrap; }
.chart-card .cv b{ font-size:22px; font-weight:700; }
.chart-card .cv .u{ font-size:13px; color:var(--muted); font-weight:500; }
.chart{ width:100%; height:auto; display:block; overflow:visible; }
.chart .ax{ font-size:9.5px; fill:var(--muted); }
.chart .gl{ stroke:var(--line); stroke-width:.7; }
.chart .ln{ fill:none; stroke:var(--accent); stroke-width:1.8; stroke-linejoin:round; }
.chart .bl{ fill:none; stroke:var(--text2); stroke-width:1.2; stroke-dasharray:4 3; opacity:.7; }
.chart .th{ stroke-width:1; stroke-dasharray:5 4; }
.chart .th.warn{ stroke:var(--warn); } .chart .th.crit{ stroke:var(--crit); }
.chart .thl{ font-size:9px; font-weight:600; }
.chart .thl.warn{ fill:var(--warn); } .chart .thl.crit{ fill:var(--crit); }
.chart .band-off{ fill:var(--text); opacity:.08; }
.chart .band-cip{ fill:var(--flow-water); opacity:.12; }
.chart .hl{ stroke:var(--text2); stroke-width:.8; }
.chart .tip rect{ fill:var(--text); }
.chart .tip text{ fill:var(--panel); font-size:10px; }
.chart-legend{ display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-top:4px; }
.chart-legend span{ display:inline-flex; align-items:center; gap:5px; }
.chart-legend i{ width:14px; height:0; border-top:2px solid var(--accent); display:inline-block; }
.chart-legend i.b{ border-top:1.5px dashed var(--text2); }
.chart-legend i.o{ height:9px; border:0; background:var(--text); opacity:.1; border-radius:2px; }
.chart-legend i.c{ height:9px; border:0; background:var(--flow-water); opacity:.25; border-radius:2px; }
.slist{ display:flex; flex-direction:column; }
.srow{ display:grid; grid-template-columns:12px 1fr auto; gap:10px; align-items:center; padding:8px 8px; margin:0 -8px; border-radius:10px; border:0; background:none; cursor:pointer; text-align:left; }
.srow:hover{ background:var(--panel2); }
.srow[aria-pressed="true"]{ background:var(--accent-soft); }
.srow .sn{ font-size:13px; font-weight:500; line-height:1.25; }
.srow .si{ font-size:11.5px; color:var(--muted); }
.srow .sv{ font-size:13.5px; font-weight:700; white-space:nowrap; text-align:right; }
.srow .sv .u{ font-weight:500; color:var(--muted); font-size:12px; }
.dev{ display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:12.5px; margin:0; }
.dev dt{ color:var(--muted); }
.dev dd{ margin:0; color:var(--text); }
.why{ background:var(--accent-soft); border-radius:12px; padding:12px 14px; font-size:13px; color:var(--text2); }
.why b{ display:block; color:var(--text); font-size:13px; margin-bottom:3px; }
.vision{ display:grid; grid-template-columns:150px 1fr; gap:12px; align-items:center; }
.vision .vt b{ font-size:22px; font-weight:700; display:block; }
.vision .vt small{ display:block; font-size:12px; color:var(--muted); line-height:1.35; }
.vision .vt .verdict{ margin-top:6px; font-size:12.5px; font-weight:600; }
.vision .vt .verdict.st-warn{ color:var(--warn); } .vision .vt .verdict.st-ok{ color:var(--ok); }
.gauge .face{ fill:var(--dial); stroke:var(--line2); stroke-width:1.5; }
.gauge .bezel{ fill:none; stroke:var(--steel-r); stroke-width:5; }
.gauge .tk{ stroke:#1d2a2e; stroke-width:1.2; }
.gauge .tl{ font-size:8px; fill:#1d2a2e; font-weight:500; }
.gauge .needle{ stroke:#C2272D; stroke-width:2.2; stroke-linecap:round; transition:transform .8s cubic-bezier(.3,1.4,.5,1); transform-origin:75px 75px; }
.gauge .roi{ fill:none; stroke:var(--accent); stroke-width:1.5; stroke-dasharray:5 4; }
.gauge .roi-t{ font-size:8.5px; fill:var(--accent); font-weight:600; }

.modal-bg{ position:fixed; inset:0; background:rgba(16,29,32,.55); display:grid; place-items:center; z-index:20; padding:20px; animation:fade .2s ease-out; }
@keyframes fade{ from{ opacity:0; } to{ opacity:1; } }
.modal{ width:min(520px,100%); background:var(--panel); border-radius:20px; padding:26px 26px 20px; box-shadow:var(--shadow); border:1px solid var(--line); max-height:90vh; overflow:auto; }
.modal h2{ margin:0 0 10px; font-size:24px; font-weight:800; line-height:1.15; }
.modal p{ color:var(--text2); margin:0 0 14px; }
.modal ol{ margin:0 0 16px; padding-left:20px; color:var(--text2); }
.modal ol li{ margin:4px 0; }
.modal .foot{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }

@media (max-width: 1640px){ .brand-name{ display:none; } }
@media (max-width: 1540px){ .btn-scen .lbl{ display:none; } .btn-scen{ padding:8px 10px; } }
@media (max-width: 1420px){ .tabs .ic{ display:none; } .tabs button{ padding:8px 10px; } }
@media (max-width: 1180px){ .main{ grid-template-columns:minmax(0,1fr) 350px; } .hud{ max-width:calc(100% - 28px); } }
@media (max-width: 980px){
  body{ height:auto; } #root{ height:auto; }
  .app{ height:auto; min-height:100%; }
  .main{ grid-template-columns:1fr; }
  .work{ overflow:visible; } .work.view-twin{ height:66vh; min-height:420px; }
  .asst{ position:static; grid-template-columns:1fr; } .asst-scroll{ overflow:visible; } .asst-side{ border-left:0; border-top:1px solid var(--line); }
  .tabs{ overflow-x:auto; max-width:100%; }
  .dash-scroll{ position:static; overflow:visible; }
  .tabs button{ padding:7px 9px; font-size:13px; } .tabs button[aria-current="page"]::after{ bottom:-8px; }
  .side{ border-left:0; border-top:1px solid var(--line); overflow:visible; }
  .plant{ display:none; }
  .demo{ width:min(290px, calc(100% - 28px)); }
  .controls .legend{ display:none; }
  .welcome{ min-height:100vh; }
  .welcome-twin{ inset:56% -25% 0 -25%; }
  .welcome-veil{ background:linear-gradient(180deg, var(--bg) 0%, var(--bg) 60%, transparent 82%); }
  .welcome-copy{ justify-content:flex-start; padding-top:36px; }
  .welcome-logo{ height:96px; margin-bottom:22px; }
}
@media (max-width: 600px){
  .topbar{ gap:8px; padding:8px 10px; }
  .brand-name{ display:none; }
  .seg button{ padding:6px 9px; font-size:12px; }
  .hud-item{ padding:7px 10px; }
  .tour-card{ left:8px; right:8px; bottom:8px; width:auto; padding:14px 14px 10px; }
  .tour-card h2{ font-size:18px; }
  .tour-cue{ display:none; }
  .summary{ grid-template-columns:1fr; }
  .hud{ top:8px; left:8px; max-width:calc(100% - 16px); }
  .hud > :not(.hud-main){ display:none; }
  .demo{ top:66px; right:8px; left:8px; width:auto; }
  .welcome-facts{ display:none; }
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  .welcome-twin{ animation:none; }
}

/* =========================================================
   Formattazione e tempo simulato
   ========================================================= */
const nf=(v,d=0)=>(v==null||!isFinite(v))?'—':Number(v).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d});
const eur=(v,d=0)=>nf(v,d)+' €';
const pctS=(v,d=1)=>(v>=0?'+':'−')+nf(Math.abs(v*100),d)+'%';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad=n=>String(n).padStart(2,'0');
const DAY=86400, HR=3600;
const T0=2*DAY+10*HR+32*60;           /* mercoledì 4 novembre 2026, 10:32 (orologio demo) */
const BASE_MS=Date.UTC(2026,10,2);    /* lunedì 2 novembre 2026, 00:00 */
const GIORNI=['lun','mar','mer','gio','ven','sab','dom'];
const MESI=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const dowOf=t=>((Math.floor(t/DAY)%7)+7)%7;
const hourOf=t=>(((t%DAY)+DAY)%DAY)/HR;
const tDate=t=>new Date(BASE_MS+t*1000);
const fmtHM=t=>{const d=tDate(t);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes());};
const fmtDM=t=>{const d=tDate(t);return d.getUTCDate()+' '+MESI[d.getUTCMonth()];};
const fmtDay=t=>GIORNI[dowOf(t)]+' '+fmtDM(t);
function fmtWhen(t,now){const dd=Math.floor(now/DAY)-Math.floor(t/DAY); if(dd<=0) return 'oggi, '+fmtHM(t); if(dd===1) return 'ieri, '+fmtHM(t); return fmtDay(t)+', '+fmtHM(t);}
function fmtAgo(s){ s=Math.max(0,s); if(s<60) return Math.round(s)+' s fa'; if(s<HR) return Math.round(s/60)+' min fa'; return Math.round(s/HR)+' h fa'; }
const fmtIv=s=>s<60?s+' s':s<HR?(s/60)+' min':(s/HR)+' h';

/* =========================================================
   Profili di funzionamento e rumore deterministico
   ========================================================= */
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
function win(h,a,b,r){ if(h<a-r||h>b+r) return 0; if(h<a) return smooth((h-(a-r))/r); if(h>b) return smooth(((b+r)-h)/r); return 1; }
function prodF(t){ const d=dowOf(t),h=hourOf(t); if(d===6) return 0; if(d===5) return win(h,6,14,.5); return win(h,6,22,.5); }
function cipF(t){ const d=dowOf(t),h=hourOf(t),pd=(d+6)%7; let v=0;
  if(d<=4) v=Math.max(v,win(h,22.4,24.3,.15),win(h,13.65,14.05,.1));
  if(pd<=4) v=Math.max(v,win(h,-1,.7,.15));
  if(d===5) v=Math.max(v,win(h,14.4,16.4,.15));
  return v; }
function recvF(t){ const h=hourOf(t); const w=Math.max(win(h,5,10.5,.2),win(h,15,18,.2)); if(!w) return 0; const p=Math.max(0,Math.sin(2*Math.PI*h*60/50)); return w*Math.pow(p,.7); }
const dayF=t=>.5+.5*Math.sin(2*Math.PI*(hourOf(t)-9)/24);
const PROF={ k:()=>0, prod:prodF, cip:cipF, recv:recvF, day:dayF,
  cold:(t,s)=>.5+.5*Math.sin(2*Math.PI*t/4200+(s.ph||0)),
  tank:(t,s)=>.5+.5*Math.sin(2*Math.PI*(hourOf(t)-4-(s.ph||0))/24),
  der:()=>0 };
function seedOf(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0)/4294967295*1000; }
function n1(seed,k){ const x=Math.sin(seed*12.9898+k*78.233)*43758.5453; return (x-Math.floor(x))*2-1; }
function vn(seed,x){ const i=Math.floor(x),f=x-i; const a=n1(seed,i),b=n1(seed,i+1); return a+(b-a)*f*f*(3-2*f); }

  for(const s of SENSORS){ const x=vals[s.id]; if(x.st!=='ok'&&!covered.has(s.id)) alerts.push({k:null,at:x.ta,dept:s.d,level:x.st,prio:x.st==='crit'?'Alta':'Media',title:s.name+' fuori soglia',msg:`Valore acquisito: ${nf(x.v,s.dec)} ${s.u}.`,causes:[],action:'Verificare lo strumento e il processo associato.',related:[s.id],key:s.id}); }

function reducer(st,a){
  switch(a.type){
   case 'START_TOUR': return {...st,screen:'app',view:'twin',mode:'tour',demoOpen:false,onb:null,toasts:[],tour:{...st.tour,started:true,paused:false}};
   case 'START_EXPLORE': return {...st,screen:'app',view:'twin',mode:'explore',onb:st.onbDone?null:0,tour:{...st.tour,paused:true}};
   case 'HOME': return {...st,screen:'welcome',demoOpen:false,modal:null};
   case 'PERIOD': return {...st,period:a.p};
   case 'SELECT': { const sel={d:a.d??null,a:a.a??null,s:a.s??null}; let tour=st.tour; if(a.src!=='tour'&&st.mode==='tour'&&!st.tour.paused) tour={...tour,paused:true};
     return {...st,sel,tour,selAlarm:null,cam:st.cam+((sel.d!==st.sel.d||a.refocus)?1:0)}; }
   case 'SEL_ALARM': return {...st,selAlarm:a.id,sel:a.id?{d:null,a:null,s:null}:st.sel};
   case 'ACK': return {...st,alarmLog:{...st.alarmLog,[a.id]:{...(st.alarmLog[a.id]||{}),ackAt:a.now,ackBy:'Operatore demo'}}};
   case 'CLOSE': return {...st,alarmLog:{...st.alarmLog,[a.id]:{...(st.alarmLog[a.id]||{}),closedAt:a.now,closedBy:'Operatore demo',note:a.note||'Chiuso senza nota.'}}};
   case 'BACK': { let tour=st.tour; if(st.mode==='tour'&&!st.tour.paused) tour={...tour,paused:true}; return {...st,sel:{d:null,a:null,s:null},tour,cam:st.cam+1}; }
   case 'FIT': return {...st,cam:st.cam+1};
   case 'TOGGLE_SCEN': { const sc={...st.sc}; let toasts=st.toasts,sessHist=st.sessHist; if(sc[a.k]!=null){ sessHist=[...sessHist,{id:scenAlarmId(a.k,sc[a.k]),k:a.k,start:sc[a.k],end:a.now}]; delete sc[a.k]; } else { sc[a.k]=a.now-SCEN[a.k].preroll; if(st.mode==='explore') toasts=[{id:a.k+Math.round(a.now),k:a.k}]; } return {...st,sc,toasts,sessHist}; }
   case 'NORMAL': return {...st,sc:{},toasts:[],sessHist:[...st.sessHist,...Object.keys(st.sc).filter(k=>st.sc[k]!=null).map(k=>({id:scenAlarmId(k,st.sc[k]),k,start:st.sc[k],end:a.now}))]};
   case 'RESET': return {...st,alarmLog:{},sessHist:[],selAlarm:null,sc:{},sel:{d:null,a:null,s:null},period:'24h',toasts:[],epoch:Date.now(),cam:st.cam+1,layers:{sensors:true,lora:false,flows:true},tour:{step:0,paused:st.mode!=='tour',started:st.tour.started}};
   case 'TOUR_GO': return {...st,mode:'tour',screen:'app',view:'twin',onb:null,tour:{started:true,paused:false,step:clamp(a.step,0,TOUR.length-1)}};
   case 'TOUR_APPLY': { const sc={...st.sc}; let sessHist=st.sessHist;
     for(const k of TOUR_KEYS){ if(a.want[k]&&sc[k]==null){ sc[k]=a.now-SCEN[k].preroll; } else if(!a.want[k]&&sc[k]!=null){ sessHist=[...sessHist,{id:scenAlarmId(k,sc[k]),k,start:sc[k],end:a.now}]; delete sc[k]; } }
     return {...st,sc,sessHist,toasts:[],sel:a.sel,period:a.period,cam:st.cam+1}; }
   case 'TOUR_PAUSE': return {...st,tour:{...st.tour,paused:true}};
   case 'TOUR_RESUME': return {...st,mode:'tour',view:'twin',tour:{...st.tour,paused:false}};
   case 'VIEW': { let tour=st.tour; if(a.v!=='twin'&&st.mode==='tour'&&!st.tour.paused) tour={...tour,paused:true}; return {...st,view:a.v,tour,cam:st.cam+1,demoOpen:false,hover:null}; }
   case 'TOUR_EXIT': return {...st,mode:'explore',tour:{...st.tour,paused:true}};
   case 'MODE': return a.mode==='tour'?reducer(st,{type:'START_TOUR'}):{...st,mode:'explore',onb:st.onbDone?null:0,tour:{...st.tour,paused:true}};
   case 'LAYER': return {...st,layers:{...st.layers,[a.k]:!st.layers[a.k]}};
   case 'DEMO': return {...st,demoOpen:a.open==null?!st.demoOpen:a.open};
   case 'TOAST_DEL': return {...st,toasts:st.toasts.filter(t=>t.id!==a.id)};
   case 'ONB_NEXT': return st.onb>=ONB.length-1?{...st,onb:null,onbDone:true}:{...st,onb:st.onb+1};
   case 'ONB_SKIP': return {...st,onb:null,onbDone:true};
   case 'MODAL': return {...st,modal:a.m};
   case 'HOVER': return st.hover===a.d?st:{...st,hover:a.d};
   case 'THEME': return {...st,theme:a.theme};
   default: return st;
  }
}

function niceTicks(mn,mx,n){ const raw=(mx-mn)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),r=raw/mag; const st=(r<1.5?1:r<3?2:r<7?5:10)*mag; const out=[]; for(let v=Math.ceil(mn/st)*st;v<=mx+1e-9;v+=st) out.push(+v.toFixed(6)); return out; }
function fmtX(t,period){ if(period==='24h') return fmtHM(t); if(period==='7d') return GIORNI[dowOf(t)]+' '+fmtHM(t); return fmtDM(t); }

function seriesWin(s,t0,t1,sc){ const n=120,step=(t1-t0)/n,sub=step>1800?4:1,pts=[],base=[]; const aff=SCEN_KEYS.some(k=>sc[k]!=null&&affects(k,s.id));
  for(let i=0;i<=n;i++){ const t=t0+i*step; let v=0,b=0; for(let j=0;j<sub;j++){ const tt=sub===1?t:t-step+(j+.5)*step/sub; v+=valueAt(s,tt,sc); if(aff) b+=valueAt(s,tt,NOSC); } pts.push({t,v:v/sub}); if(aff) base.push({t,v:b/sub}); }
  return {pts,base:aff?base:null}; }
function Chart({s,period,now,sc,W=360,H=178,range}){
  const minuteKey=Math.floor(now/(period==='24h'?30:300));
  const data=useMemo(()=>range?seriesWin(s,range.t0,range.t1,sc):seriesOf(s,period,now,sc),[s.id,period,minuteKey,scKey(sc),range?Math.round(range.t0/60)+'-'+Math.round(range.t1/60):'']);
  if(range){ const span=range.t1-range.t0; period=span<=1.5*DAY?'24h':span<=8*DAY?'7d':'30d'; }
  const [hi,setHi]=useState(null);
  const L=40,R=10,T=14,B=24,iw=W-L-R,ih=H-T-B,n=data.pts.length;
  const vals=data.pts.map(p=>p.v).concat(data.base?data.base.map(p=>p.v):[]);
  let mn=Math.min(...vals),mx=Math.max(...vals);
  const thr=[]; if(s.w){ s.w.forEach((v,i)=>{ if(v!=null) thr.push({v,k:'warn',i}); }); }
  if(s.c){ s.c.forEach((v,i)=>{ if(v==null) return; const wv=s.w?s.w[i]:null; const beyond=i===0?mn<(wv!=null?wv:v):mx>(wv!=null?wv:v); if(beyond) thr.push({v,k:'crit',i}); }); }
  thr.forEach(t=>{ mn=Math.min(mn,t.v); mx=Math.max(mx,t.v); });
  if(mx-mn<1e-6){ mx+=1; mn-=1; } const padv=(mx-mn)*.1; mn-=padv; mx+=padv;
  const xs=i=>L+i/(n-1)*iw, ys=v=>T+(1-(v-mn)/(mx-mn))*ih;
  const line=data.pts.map((p,i)=>(i?'L':'M')+f1(xs(i))+' '+f1(ys(p.v))).join(' ');
  const area=line+` L${f1(xs(n-1))} ${T+ih} L${L} ${T+ih} Z`;
  const bline=data.base?data.base.map((p,i)=>(i?'L':'M')+f1(xs(i))+' '+f1(ys(p.v))).join(' '):null;
  const ticks=niceTicks(mn,mx,4);
  const bands=[]; if(period!=='30d'){ let cur=null,start=0; data.pts.forEach((p,i)=>{ const k=cipF(p.t)>=.5?'cip':prodF(p.t)<.5?'off':null; if(k!==cur){ if(cur) bands.push({k:cur,a:start,b:i}); cur=k; start=i; } }); if(cur) bands.push({k:cur,a:start,b:n-1}); }
  const xl=(period==='24h'?[0,.25,.5,.75,1]:[0,1/3,2/3,1]).map(f=>Math.round(f*(n-1)));
  const onMove=e=>{ const r=e.currentTarget.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W; setHi(clamp(Math.round((x-L)/iw*(n-1)),0,n-1)); };
  const thrLabel=t=>(t.k==='crit'?'critico ':'soglia ')+nf(t.v,s.dec)+(s.wp?' (in funzione)':'');
  let tip=null; if(hi!=null){ const p=data.pts[hi],x=xs(hi),y=ys(p.v); const txt=fmtX(p.t,period)+'  '+nf(p.v,s.dec)+' '+s.u; const tw=txt.length*5.3+14; const tx=x+tw+8>W?x-tw-6:x+6;
    tip=html`<g className="tip"><line className="hl" x1=${x} y1=${T} x2=${x} y2=${T+ih}/><circle cx=${x} cy=${y} r="3.2" fill="var(--accent)" stroke="var(--panel)" strokeWidth="1.2"/><rect x=${tx} y=${T} width=${tw} height="18" rx="5"/><text x=${tx+7} y=${T+12.5}>${txt}</text></g>`; }
  return html`<div><svg className="chart" viewBox=${`0 0 ${W} ${H}`} onPointerMove=${onMove} onPointerLeave=${()=>setHi(null)} role="img" aria-label=${'Andamento di '+s.name+' nelle ultime '+PERIODS[period].label}>
    <defs><linearGradient id="cgrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style=${{stopColor:'var(--accent)',stopOpacity:.28}}/><stop offset="1" style=${{stopColor:'var(--accent)',stopOpacity:0}}/></linearGradient></defs>
    ${bands.map((b,i)=>html`<rect key=${'b'+i} className=${'band-'+b.k} x=${xs(b.a)} y=${T} width=${Math.max(1,xs(b.b)-xs(b.a))} height=${ih}/>`)}
    ${ticks.map(v=>html`<g key=${'t'+v}><line className="gl" x1=${L} x2=${W-R} y1=${ys(v)} y2=${ys(v)}/><text className="ax" x=${L-6} y=${ys(v)+3} textAnchor="end">${nf(v,Math.abs(mx-mn)<4?1:0)}</text></g>`)}
    ${xl.map((i,k)=>html`<text key=${'x'+k} className="ax" x=${xs(i)} y=${H-6} textAnchor=${k===0?'start':k===xl.length-1?'end':'middle'}>${fmtX(data.pts[i].t,period)}</text>`)}
    ${thr.map((t,i)=>html`<g key=${'th'+i}><line className=${'th '+t.k} x1=${L} x2=${W-R} y1=${ys(t.v)} y2=${ys(t.v)}/><text className=${'thl '+t.k} x=${W-R} y=${ys(t.v)<T+12?ys(t.v)+10:ys(t.v)-3} textAnchor="end">${thrLabel(t)}</text></g>`)}
    <path d=${area} fill="url(#cgrad)"/>${bline?html`<path className="bl" d=${bline}/>`:null}<path className="ln" d=${line}/>${tip}
  </svg>
  <div className="chart-legend"><span><i></i>Misura</span>${bline?html`<span><i className="b"></i>Profilo atteso</span>`:null}${period!=='30d'?html`<span><i className="o"></i>Fermo</span><span><i className="c"></i>Lavaggi CIP</span>`:html`<span>Medie su 4 ore</span>`}</div></div>`;
}

function Gauge({s,v,st}){ const [a0,a1]=s.range; const ang=x=>135+270*(clamp(x,a0,a1)-a0)/(a1-a0); const cx=75,cy=75,R=52;
  const pt=(a,r)=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
  const arc=(x1,x2,r,col)=>{ const s1=ang(x1),s2=ang(x2); const p1=pt(s1,r),p2=pt(s2,r); return html`<path d=${`M${f1(p1[0])} ${f1(p1[1])} A${r} ${r} 0 ${s2-s1>180?1:0} 1 ${f1(p2[0])} ${f1(p2[1])}`} fill="none" stroke=${col} strokeWidth="6"/>`; };
  const ticks=[]; for(let k=0;k<=8;k++){ const x=a0+(a1-a0)*k/8,a=ang(x); const p1=pt(a,R-2),p2=pt(a,R-9),pl=pt(a,R-18); ticks.push(html`<g key=${k}><line className="tk" x1=${f1(p1[0])} y1=${f1(p1[1])} x2=${f1(p2[0])} y2=${f1(p2[1])}/><text className="tl" x=${f1(pl[0])} y=${f1(pl[1]+3)} textAnchor="middle">${nf(x)}</text></g>`); }
  const w=s.w||[a0,a1],c=s.c||[a0,a1];
  return html`<svg className="gauge" viewBox="0 0 150 164" width="150" height="164" aria-label=${'Strumento letto: '+nf(v,s.dec)+' '+s.u}>
    <rect className="roi" x="6" y="6" width="138" height="152" rx="10"/><text className="roi-t" x="75" y="151" textAnchor="middle">area di lettura</text>
    <circle className="face" cx=${cx} cy=${cy} r=${R+6}/><circle className="bezel" cx=${cx} cy=${cy} r=${R+6}/>
    ${arc(w[0],w[1],R-4,'var(--ok)')}${c[0]>a0?arc(a0,c[0],R-4,'var(--crit)'):null}${c[1]<a1?arc(c[1],a1,R-4,'var(--crit)'):null}${arc(c[0],w[0],R-4,'var(--warn)')}${arc(w[1],c[1],R-4,'var(--warn)')}
    ${ticks}<text className="tl" x=${cx} y=${cy+24} textAnchor="middle">${s.u}</text>
    <line className="needle" x1=${cx} y1=${cy} x2=${cx+R-12} y2=${cy} style=${{transform:`rotate(${ang(v)}deg)`}}/><circle cx=${cx} cy=${cy} r="4.5" fill="#1d2a2e"/>
  </svg>`; }

function Overview({snap,kpi,period,now,hover,dispatch}){

function Spark({s,period,now,sc,st,h=36}){
  const v=sparkOf(s,period,now,sc),n=v.length; let mn=Math.min(...v),mx=Math.max(...v); const rng=Math.max(mx-mn,1e-6);
  const thr=[]; if(s.w) s.w.forEach(t=>{ if(t!=null&&t>=mn-rng*1.5&&t<=mx+rng*1.5) thr.push(t); });
  thr.forEach(t=>{ mn=Math.min(mn,t); mx=Math.max(mx,t); }); if(mx-mn<1e-6){ mx+=1; mn-=1; } const pd=(mx-mn)*.12; mn-=pd; mx+=pd;
  const W=100,H=30,X=i=>(i/(n-1)*W).toFixed(2),Y=x=>(H-(x-mn)/(mx-mn)*H).toFixed(2);
  const line=v.map((x,i)=>(i?'L':'M')+X(i)+' '+Y(x)).join(' ');
  return html`<svg className=${'spark st-'+(st||'ok')} viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none" style=${{height:h+'px'}} aria-hidden="true">${thr.map((t,i)=>html`<line key=${i} className="sth" x1="0" x2=${W} y1=${Y(t)} y2=${Y(t)}/>`)}<path className="sa" d=${line+` L${W} ${H} L0 ${H} Z`}/><path className="sl" d=${line}/></svg>`;
}

  sess.forEach(r=>{ const at=alertAt(r.k,r.start,{[r.k]:r.start}); if(at>=r.end) return; const sd=SCEN[r.k]; out.push({id:r.id,live:false,src:'scen',k:r.k,scStart:r.start,level:sd.level,prio:sd.prio,title:sd.title,dept:sd.dept,key:sd.key,start:at,end:r.end,causes:sd.causes,action:sd.action,note:sd.note,econ:sd.econ,cat:CAT_OF[r.k],msg:'Condizione rientrata dopo la disattivazione dello scenario.'}); });
  PAST.forEach(p=>{ const st=p.fx?p.s+240:p.s,en=p.fx?p.s+p.dur+300:p.s+p.dur; if(en>now||st<now-30*DAY) return; out.push({id:p.id,live:false,src:'past',level:p.level,prio:p.prio,title:p.title,dept:p.dept,key:p.key,start:st,end:en,ackAt:st+p.ack,ackBy:p.ackBy,closedAt:en+p.close,closedBy:p.ackBy,note:p.note,cat:p.cat,msg:p.msg,valTxt:p.val}); });
  for(let dd=Math.floor((now-30*DAY)/DAY);dd<=Math.floor(now/DAY);dd++){ if(((dd%3)+3)%3!==1) continue; const st=dd*DAY+3.133*HR,en=dd*DAY+3.2*HR; if(en>now||st<now-30*DAY) continue;

  out.forEach(a=>{ const l=log[a.id]; if(l){ if(l.ackAt&&!a.ackAt){ a.ackAt=l.ackAt; a.ackBy=l.ackBy; } if(l.closedAt&&!a.closedAt){ a.closedAt=l.closedAt; a.closedBy=l.closedBy; if(l.note) a.note=l.note; } }
    a.state=a.closedAt?'closed':a.end==null?(a.ackAt?'ack':'unack'):'ended'; });
  const rk={unack:0,ack:1,ended:2,closed:3}; out.sort((a,b)=>rk[a.state]-rk[b.state]||b.start-a.start); return out;
}

const AI_RULES=`Sei l’assistente dati di SS9 Plant Intelligence, in una DEMO commerciale con dati simulati di un caseificio.
Regole:
1. Rispondi in italiano, con tono professionale e concreto.
2. Usa solo i dati del blocco DATI e, se disponibile, lo strumento analizza_sensore. Non inventare misure, impianti, costi, persone o eventi. Se un dato manca, dillo e indica quale misura servirebbe.
3. Distingui i fatti dalle ipotesi: le cause sono possibili, non certe.
4. Ogni stima economica mostra formula e ipotesi (usa le tariffe del blocco DATI) ed è illustrativa.
5. Non dare istruzioni operative su sicurezza o emergenze: per il gas rimanda alla procedura aziendale e al sistema di rilevazione certificato.
6. Formato Markdown semplice: titoli con ## e ###, elenchi con -, tabelle con |, grassetto con **. Niente HTML, niente blocchi di codice.
7. Per inserire un grafico scrivi su una riga a sé [[grafico ID PERIODO]], con ID = TOT-EL oppure l’ID di un punto di misura, PERIODO = 24h, 7d o 30d. Al massimo 3 grafici, solo nei report.
8. Domanda puntuale: risposta breve, al massimo 150 parole. Report: titolo, sintesi in 2-3 frasi, sezioni con tabelle, azioni consigliate. Al massimo circa 450 parole.
9. Chiudi i report con la riga: Dati simulati, ambiente dimostrativo.`;
function makeTool(atNow,scNow){ return {name:'analizza_sensore',
  description:'Statistiche di un punto di misura nelle ultime N ore fino all’ora simulata attuale: minimo, massimo, media, minuti fuori soglia di attenzione e fino a 48 medie a intervalli regolari. Usalo per andamenti o durate non presenti nel blocco DATI.',
  inputSchema:{type:'object',properties:{id:{type:'string',description:'ID del punto di misura, per esempio TT-601, oppure TOT-EL per la potenza totale'},ore:{type:'number',description:'Ampiezza della finestra in ore, da 1 a 720'}},required:['id','ore']},
  execute:(inp)=>{ const id=String(inp.id||'').toUpperCase().trim(); const s=VIRT[id]||S[id]; if(!s) throw new Error('ID sconosciuto: '+id); const ore=clamp(Number(inp.ore)||24,1,720),t0=atNow-ore*HR; const st=statsOf(s,t0,atNow,scNow);
    const n=Math.min(48,Math.max(6,Math.round(ore))),step=ore*HR/n,pts=[]; for(let i=0;i<n;i++){ const a=t0+i*step; let sum=0; for(let j=0;j<6;j++) sum+=valueAt(s,a+(j+.5)*step/6,scNow); pts.push({da:fmtDay(a)+' '+fmtHM(a),media:+(sum/6).toFixed(2)}); }
    return {id:s.id,nome:s.name,unita:s.u,finestra_ore:ore,minimo:+st.min.toFixed(2),massimo:+st.max.toFixed(2),media:+st.avg.toFixed(2),minuti_fuori_soglia:Math.round(st.overMin),soglie_attenzione:s.w||null,medie:pts}; }}; }

function inl(text){ return String(text).split(/(\*\*[^*]+\*\*|`[^`]+`)/g).map((p,i)=>p.length>4&&p.startsWith('**')&&p.endsWith('**')?html`<strong key=${i}>${p.slice(2,-2)}</strong>`:p.length>2&&p.startsWith('`')&&p.endsWith('`')?html`<code key=${i}>${p.slice(1,-1)}</code>`:p); }
function mdParse(src){ const lines=String(src||'').replace(/\r/g,'').split('\n'),out=[]; let i=0;
  const isSpecial=t=>!t||/^#{1,6}\s/.test(t)||t.startsWith('|')||/^[-*•]\s+/.test(t)||/^\d+[.)]\s+/.test(t)||t.startsWith('[[')||/^-{3,}$/.test(t)||/^```/.test(t);
  while(i<lines.length){ const t=lines[i].trim(); let m;
    if(!t||/^-{3,}$/.test(t)||/^```/.test(t)){ i++; continue; }
    if(t.startsWith('[[')){ m=t.match(/^\[\[\s*grafico\s+([A-Za-z0-9-]+)(?:\s+(24h|7d|30d))?\s*\]\]$/i); if(m) out.push({t:'chart',id:m[1].toUpperCase(),p:m[2]?m[2].toLowerCase():null}); i++; continue; }
    if((m=t.match(/^(#{1,6})\s+(.*)$/))){ out.push({t:'h',lvl:m[1].length,text:m[2].replace(/\*\*/g,'')}); i++; continue; }
    if(t.startsWith('|')){ const rows=[]; while(i<lines.length&&lines[i].trim().startsWith('|')){ const cells=lines[i].trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim()); if(!cells.every(c=>/^:?-{2,}:?$/.test(c))) rows.push(cells); i++; } if(rows.length) out.push({t:'table',head:rows[0],rows:rows.slice(1)}); continue; }
    if(/^[-*•]\s+/.test(t)){ const it=[]; while(i<lines.length&&/^[-*•]\s+/.test(lines[i].trim())){ it.push(lines[i].trim().replace(/^[-*•]\s+/,'')); i++; } out.push({t:'ul',items:it}); continue; }
    if(/^\d+[.)]\s+/.test(t)){ const it=[]; while(i<lines.length&&/^\d+[.)]\s+/.test(lines[i].trim())){ it.push(lines[i].trim().replace(/^\d+[.)]\s+/,'')); i++; } out.push({t:'ol',items:it}); continue; }
    const para=[]; while(i<lines.length&&!isSpecial(lines[i].trim())){ para.push(lines[i].trim()); i++; } out.push({t:'p',text:para.join(' ')}); }
  return out; }
function Md({text,at,sc,period}){ const blocks=mdParse(text);
  return html`<div className="md">${blocks.map((b,i)=>{
    if(b.t==='h') return b.lvl<=2?html`<h3 key=${i}>${b.text}</h3>`:b.lvl===3?html`<h4 key=${i}>${b.text}</h4>`:html`<h5 key=${i}>${b.text}</h5>`;
    if(b.t==='p') return html`<p key=${i}>${inl(b.text)}</p>`;
    if(b.t==='ul') return html`<ul key=${i}>${b.items.map((x,j)=>html`<li key=${j}>${inl(x)}</li>`)}</ul>`;
    if(b.t==='ol') return html`<ol key=${i}>${b.items.map((x,j)=>html`<li key=${j}>${inl(x)}</li>`)}</ol>`;
    if(b.t==='table') return html`<div key=${i} className="scroll-x"><table><thead><tr>${b.head.map((c,j)=>html`<th key=${j}>${inl(c)}</th>`)}</tr></thead><tbody>${b.rows.map((r,j)=>html`<tr key=${j}>${r.map((c,k)=>html`<td key=${k}>${inl(c)}</td>`)}</tr>`)}</tbody></table></div>`;
    if(b.t==='chart'){ const s=VIRT[b.id]||S[b.id]; const p=b.p||period; if(!s) return html`<p key=${i} className="note">Grafico non disponibile: ${b.id} non è un punto di misura della demo.</p>`;
      return html`<div key=${i} className="mchart"><small>${s.id}, ultime ${PERIODS[p].label}</small><strong>${s.name}</strong><${Chart} s=${s} period=${p} now=${at} sc=${sc} W=${640} H=${210}/></div>`; }
    return null; })}</div>`; }
const mdExport=t=>String(t).replace(/^\[\[\s*grafico\s+([A-Za-z0-9-]+)(?:\s+(24h|7d|30d))?\s*\]\]$/gim,(m,id,p)=>{ const s=VIRT[id.toUpperCase()]||S[id.toUpperCase()]; return `(Grafico: ${s?s.name:id}${p?', ultime '+PERIODS[p.toLowerCase()].label:''})`; });

const CTL={c:null};
const ASK_EX=['Perché il costo energetico di oggi è diverso dal solito?','Prepara un report per il direttore sulle anomalie aperte','Quanto ci costa l’aria compressa quando lo stabilimento è fermo?','Quali reparti consumano di più rispetto al latte lavorato?','Confronta i consumi d’acqua degli ultimi 7 giorni con i 7 precedenti'];
const AI_ERR={not_granted:'L’uso di Claude non è stato autorizzato per questa pagina.',sampling_disabled:'Claude non è disponibile per questo account.',not_declared:'La pagina non è abilitata a usare Claude.',capability_disabled:'Claude non è utilizzabile in questa vista.',capability_removed:'Claude non è utilizzabile in questa vista.',
  rate_limited:'Troppe richieste ravvicinate o limite di utilizzo raggiunto: riprova tra poco.',session_expired:'Sessione scaduta: accedi di nuovo a Claude e riprova.',refused:'Claude non ha risposto a questa richiesta: prova a riformularla.',prompt_too_large:'La richiesta è troppo ampia: prova a restringerla.',empty_completion:'Nessuna risposta: prova a semplificare la domanda.',tools_unavailable:'Gli strumenti di analisi non sono disponibili in questa vista.'};
const AI_OFF=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'];

function Assistant({app,now,snap,alarms,chat,setChat,ai,setAi}){
  const [q,setQ]=useState(''),[flash,setFlash]=useState(null); const scRef=useRef(null),chatRef=useRef(chat),lenRef=useRef(0),stick=useRef(true); chatRef.current=chat;
  const busy=chat.some(m=>m.status==='thinking'||m.status==='streaming');
  const aiOn=!!ai.sample&&!ai.off;
  useEffect(()=>{ const el=scRef.current; if(!el) return; const grew=chat.length>lenRef.current; lenRef.current=chat.length; const last=chat[chat.length-1];
    if(grew&&last&&last.kind==='local'){ const inner=el.firstElementChild; const u=inner&&inner.children[inner.children.length-2]; if(u) el.scrollTop+=u.getBoundingClientRect().top-el.getBoundingClientRect().top-12; }
    else if(grew||stick.current) el.scrollTop=el.scrollHeight; },[chat]);
  const upd=(id,patch)=>setChat(c=>c.map(m=>m.id===id?{...m,...patch}:m));
  const runLocal=rep=>{ const id='l'+Date.now(); const md=rep.build({now,sc:app.sc,period:app.period,snap,alarms});
    setChat(c=>[...c,{id:id+'u',role:'user',kind:'local',text:rep.title+', ultime '+PERIODS[app.period].label,status:'done'},{id,role:'assistant',kind:'local',title:rep.title,text:md,status:'done',at:now,sc:{...app.sc},period:app.period}]); };
  const ask=async(question)=>{ const qq=String(question||'').trim(); if(!qq||!aiOn||busy) return; setQ('');
    const id='a'+Date.now(),atNow=now,scNow={...app.sc},per=app.period;
    const prior=chatRef.current.filter(m=>m.kind==='ai'&&(m.role==='user'||m.status==='done')&&m.text).slice(-8).map(m=>({role:m.role,content:m.text}));
    setChat(c=>[...c,{id:id+'u',role:'user',kind:'ai',text:qq,status:'done'},{id,role:'assistant',kind:'ai',text:'',status:'thinking',at:atNow,sc:scNow,period:per}]);
    const ctl=new AbortController(); CTL.c=ctl;
    let digest; try{ digest=buildDigest(atNow,scNow,per,alarms); }catch(e){ upd(id,{status:'error',err:'upstream_error'}); return; }
    const turns=[{role:'user',content:AI_RULES+'\n\nDATI\n'+digest},...prior,{role:'user',content:qq}];
    const opts={signal:ctl.signal,cache:false,modelTier:'default',onText:({text})=>upd(id,{text,status:'streaming'})};
    if(ai.tools) opts.tools=[makeTool(atNow,scNow)];
    try{ const r=await ai.sample(turns,opts); upd(id,{text:r.text,status:'done',truncated:r.truncated}); }
    catch(e){ const code=(e&&e.code)||'upstream_error'; upd(id,{text:code==='refused'?'':(e&&e.text)||'',status:code==='cancelled'?'stopped':'error',err:code}); if(AI_OFF.includes(code)) setAi(a=>({...a,off:true})); } };
  const copy=async m=>{ try{ await navigator.clipboard.writeText(mdExport(m.text)); setFlash(m.id+'c'); }catch(e){ setFlash(m.id+'x'); } setTimeout(()=>setFlash(null),1800); };
  const save=async m=>{ if(!ai.downloads) return; const name=`ss9-${(m.title||'risposta').toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${fmtHM(m.at).replace(':','')}.md`;
    try{ await ai.downloads.save({filename:name,data:`# SS9 Plant Intelligence\n\nCaseificio dimostrativo, dati delle ${fmtHM(m.at)} di ${fmtDay(m.at)} (ora simulata), ultime ${PERIODS[m.period].label}.\n\n`+mdExport(m.text)}); setFlash(m.id+'s'); }catch(e){ if(e&&e.code!=='declined') setFlash(m.id+'x'); } setTimeout(()=>setFlash(null),1800); };
  const state=!ai.ready?['Connessione a Claude…','info']:aiOn?['Claude collegato','ok']:ai.off?['Claude non autorizzato','warn']:['Domande libere non disponibili in questa vista','warn'];
  return html`<div className="asst">
    <div className="asst-main">
      <div className="asst-scroll" ref=${scRef} onScroll=${e=>{ const el=e.currentTarget; stick.current=el.scrollHeight-el.scrollTop-el.clientHeight<80; }}><div className="asst-inner">
        ${!chat.length?html`<div className="asst-empty"><h2>Chiedi ai dati dello stabilimento</h2><p>Fai una domanda o chiedi un report: l’assistente risponde usando solo i dati della demo, cioè misure, allarmi, consumi e stime. I grafici nei report sono disegnati dai dati del motore, non dall’AI.</p><p className="note">I report rapidi a destra sono calcolati sulla pagina e funzionano anche senza collegamento a Claude.</p></div>`:null}
        ${chat.map(m=>m.role==='user'?html`<div key=${m.id} className="u-msg">${m.text}</div>`:html`<article key=${m.id} className="a-msg" aria-live=${m.status==='streaming'?'polite':'off'}>
          <div className="a-head"><b>${m.kind==='local'?'Report rapido':'Assistente'}</b><span>${m.kind==='local'?'calcolato sulla pagina':'Claude'}, dati delle ${fmtHM(m.at)}, ultime ${PERIODS[m.period].label}</span></div>
          ${m.status==='thinking'?html`<div className="thinking"><span className="spin"></span>Sto leggendo i dati dello stabilimento…</div>`:html`<${Md} text=${m.text} at=${m.at} sc=${m.sc} period=${m.period}/>`}
          ${m.status==='error'?html`<p className="err">${AI_ERR[m.err]||'Risposta interrotta da un errore temporaneo. Puoi riprovare.'}</p>`:null}
          ${m.status==='stopped'?html`<p className="note">Risposta interrotta.</p>`:null}
          ${m.truncated?html`<p className="note">Risposta tagliata per lunghezza: chiedi una parte alla volta.</p>`:null}
          ${(m.status==='done'||m.status==='stopped')&&m.text?html`<div className="a-foot"><button className="btn link sm" onClick=${()=>copy(m)}>${flash===m.id+'c'?'Copiato':'Copia testo'}</button>${ai.downloads?html`<button className="btn link sm" onClick=${()=>save(m)}>${flash===m.id+'s'?'Salvato':'Scarica .md'}</button>`:null}${flash===m.id+'x'?html`<span className="note" style=${{margin:0}}>Operazione non riuscita in questa vista.</span>`:null}</div>`:null}
        </article>`)}
      </div></div>
      <div className="asst-input"><div className="row">
        <textarea value=${q} disabled=${!aiOn} placeholder=${aiOn?'Chiedi un’informazione o un report, per esempio: consumi della settimana per reparto con i costi':'Le domande libere richiedono il collegamento a Claude. Usa i report rapidi.'} onInput=${e=>setQ(e.target.value)} onKeyDown=${e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); ask(q); } }} aria-label="Domanda all’assistente"></textarea>
        ${busy?html`<button className="btn ghost" onClick=${()=>CTL.c&&CTL.c.abort()}>Interrompi</button>`:html`<button className="btn primary" disabled=${!aiOn||!q.trim()} onClick=${()=>ask(q)}>Invia</button>`}
      </div><p className="hint">Invio per inviare, Maiusc+Invio per andare a capo. Ogni domanda usa il tuo utilizzo di Claude.</p></div>
    </div>
    <aside className="asst-side">
      <div className="sec"><span className=${'ai-state st-'+state[1]}><span className=${'dot st-'+state[1]}></span>${state[0]}</span></div>
      <div className="sec"><h3>Report rapidi<span className="aside">ultime ${PERIODS[app.period].label}</span></h3>${REPORTS.map(r=>html`<button key=${r.id} className="rep-btn" onClick=${()=>runLocal(r)}><b>${r.title}</b><small>${r.desc}</small></button>`)}</div>
      <div className="sec"><h3>Prova a chiedere</h3>${ASK_EX.map((x,i)=>html`<button key=${i} className="ask-chip" disabled=${!aiOn||busy} onClick=${()=>ask(x)}>${x}</button>`)}</div>
      <div className="sec"><div className="why"><b>Come risponde</b>L’assistente legge un riepilogo dei dati della demo calcolato al momento della domanda e può analizzare un punto di misura nel dettaglio. Se un dato manca lo dice. Le stime mostrano formula e tariffe.</div></div>
      ${chat.length?html`<div className="sec"><button className="btn ghost sm" disabled=${busy} onClick=${()=>setChat([])}>Svuota la conversazione</button></div>`:null}
    </aside>
  </div>`;
}

function AssessmentModal({dispatch}){ const ref=useRef(null); useEffect(()=>{ ref.current&&ref.current.focus(); },[]);
  return html`<div className="modal-bg" onClick=${e=>{ if(e.target===e.currentTarget) dispatch({type:'MODAL',m:null}); }}><div className="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h2 id="mt">Richiedi un assessment del tuo stabilimento</h2>
    <p>Si parte dall’impianto reale: reparti, utenze e strumenti già presenti. L’assessment serve a scegliere i punti di misura che valgono di più e a stimare il ritorno con i tuoi dati, non con quelli della demo.</p>
    <ol><li>Sopralluogo e mappatura di impianti, utenze e strumenti esistenti.</li><li>Analisi di bollette, consumi e controlli manuali ricorrenti.</li><li>Proposta di monitoraggio con priorità e stima del ritorno.</li></ol>
    <p>Per fissarlo, parlane con il tuo referente SS9 Digitale o visita ss9digitale.it.</p>
    <div className="foot"><button ref=${ref} className="btn primary" onClick=${()=>dispatch({type:'MODAL',m:null})}>Torna alla demo</button></div>
  </div></div>`; }

function Welcome({snap,dispatch}){
  return html`<main className="welcome">
    <div className="welcome-twin" aria-hidden="true"><${Twin} snap=${snap} sel=${{d:null,a:null,s:null}} hover=${null} layers=${{sensors:true,lora:false,flows:true}} interactive=${false} welcome=${true} cam=${0} onSelect=${()=>{}} onHover=${()=>{}}/></div>
    <div className="welcome-veil"></div>
    <div className="welcome-copy">
      <${Logo} full=${true} className="welcome-logo"/>
      <p className="welcome-product">Plant Intelligence</p>
      <h1>Il tuo stabilimento. Tutto sotto controllo.</h1>
      <p className="welcome-sub">Dall’energia agli impianti, ogni dato diventa una decisione.</p>
      <div className="welcome-actions">
        <button className="btn primary" onClick=${()=>dispatch({type:'START_TOUR'})}><${Icon} n="play" size=${16}/>Avvia presentazione guidata</button>
        <button className="btn ghost" onClick=${()=>dispatch({type:'START_EXPLORE'})}><${Icon} n="compass" size=${17}/>Esplora lo stabilimento</button>
      </div>
      <p className="welcome-facts">Un caseificio dimostrativo con dieci reparti, 27 impianti e 70 punti di misura su energia, acqua, processo e manutenzione.</p>
      <span className="demo-badge" style=${{alignSelf:'flex-start'}}>Ambiente Demo · Dati simulati</span>
    </div>
  </main>`; }

function App(){
  const [st,dispatch]=useReducer(reducer,null,initState);
  const [,setTick]=useState(0);
  useEffect(()=>{ const id=setInterval(()=>setTick(x=>x+1),1000); return ()=>clearInterval(id); },[]);
  const now=T0+(Date.now()-st.epoch)/1000;
  const sec=Math.floor(now);
  const snap=useMemo(()=>snapshot(now,st.sc),[sec,st.sc]);
  const kpi=st.screen==='app'?periodKpis(st.period,now,st.sc):null;
  useEffect(()=>{ const r=document.documentElement; if(st.theme==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',st.theme); try{ localStorage.setItem('ss9pi-theme',st.theme); }catch(e){} },[st.theme]);
  useEffect(()=>{ const h=e=>{ if(e.key==='Escape'){ if(st.modal) dispatch({type:'MODAL',m:null}); else if(st.demoOpen) dispatch({type:'DEMO',open:false}); } }; window.addEventListener('keydown',h); return ()=>window.removeEventListener('keydown',h); },[st.modal,st.demoOpen]);
  useEffect(()=>{ if(st.screen!=='app'||st.mode!=='tour'||st.tour.paused) return; const T=TOUR[st.tour.step]; const want={};
    TOUR.slice(0,st.tour.step+1).forEach(s=>s.scen.forEach(k=>{ want[k]=true; })); T.scen.forEach(k=>{ want[k]=true; });
    dispatch({type:'TOUR_APPLY',now:T0+(Date.now()-st.epoch)/1000,want,sel:T.sel?{...T.sel}:{d:null,a:null,s:null},period:T.period,quiet:!!T.summary}); },[st.screen,st.mode,st.tour.step,st.tour.paused,st.epoch]);
  const onSelect=useCallback(o=>dispatch({type:'SELECT',...o}),[]);
  const [chat,setChat]=useState([]);
  useEffect(()=>{ setChat([]); },[st.epoch]);
  const [ai,setAi]=useState({ready:false,sample:null,tools:false,downloads:null,off:false});
  useEffect(()=>{ let alive=true; const C=window.claude; if(!C||typeof C.use!=='function'){ setAi(a=>({...a,ready:true})); return; }
    Promise.all([C.use('sample').catch(()=>null),C.use('downloads').catch(()=>null)]).then(async([sm,dl])=>{ let tools=false; if(sm&&sm.limits){ try{ const lim=await sm.limits(); tools=!!(lim&&lim.tools); }catch(e){} } if(alive) setAi(a=>({...a,ready:true,sample:sm,tools,downloads:dl})); });
    return ()=>{ alive=false; }; },[]);
  const alarms=useMemo(()=>buildAlarms(now,st.sc,snap,st.alarmLog,st.sessHist),[sec,st.sc,st.alarmLog,st.sessHist]);
  const nUnack=alarms.filter(a=>a.state==='unack').length;
  const onHover=useCallback(d=>dispatch({type:'HOVER',d}),[]);
  if(st.screen==='welcome') return html`<${Welcome} snap=${snap} dispatch=${dispatch}/>`;
  const tourOn=st.mode==='tour', V=st.view, monitor=V==='monitor';
  const selA=st.selAlarm?alarms.find(a=>a.id===st.selAlarm)||null:null;
  let side=null;
  if(V==='twin') side=st.sel.d?html`<${DeptDetail} snap=${snap} sel=${st.sel} period=${st.period} now=${now} dispatch=${dispatch} view=${V}/>`:html`<${Overview} snap=${snap} kpi=${kpi} period=${st.period} now=${now} hover=${st.hover} dispatch=${dispatch}/>`;
  else if(V==='monitor'||V==='alarms'){ if(V==='alarms'&&st.selAlarm) side=html`<${AlarmDetail} a=${selA} now=${now} sc=${st.sc} dispatch=${dispatch}/>`; else if(st.sel.d) side=html`<${DeptDetail} snap=${snap} sel=${st.sel} period=${st.period} now=${now} dispatch=${dispatch} view=${V}/>`; }
  const showSide=!!side;
  return html`<div className="app">
    <${TopBar} st=${st} now=${now} dispatch=${dispatch} nUnack=${nUnack}/>
    <div className=${'main'+(showSide?'':' full')}>
      <section className=${'work view-'+st.view}>
        ${monitor?html`<div className="dash-scroll" aria-label="Monitoraggio"><${Monitor} snap=${snap} kpi=${kpi} period=${st.period} now=${now} app=${st} dispatch=${dispatch}/></div>`
        :V==='alarms'?html`<div className="dash-scroll" aria-label="Allarmi"><${AlarmsView} alarms=${alarms} now=${now} app=${st} dispatch=${dispatch}/></div>`
        :V==='assistant'?html`<${Assistant} app=${st} now=${now} snap=${snap} alarms=${alarms} chat=${chat} setChat=${setChat} ai=${ai} setAi=${setAi}/>`
        :html`<div className="stage" aria-label="Gemello digitale">
          <${Twin} snap=${snap} sel=${st.sel} hover=${st.hover} layers=${st.layers} interactive=${true} cam=${st.cam} shift=${tourOn&&!st.tour.paused} onSelect=${onSelect} onHover=${onHover}/>
          <${Hud} snap=${snap} now=${now} dispatch=${dispatch}/>
          <${Controls} layers=${st.layers} dispatch=${dispatch}/>
          ${tourOn?html`<${DemoPanel} sc=${st.sc} now=${now} dispatch=${dispatch} variant="dock"/>`:null}
          ${tourOn&&!st.tour.paused?html`<${TourCard} step=${st.tour.step} snap=${snap} dispatch=${dispatch}/>`:null}
          ${tourOn&&st.tour.paused?html`<div className="card-glass tour-pill"><span>Tour in pausa al capitolo ${st.tour.step+1}</span><button className="btn primary sm" onClick=${()=>dispatch({type:'TOUR_RESUME'})}>Riprendi</button><button className="btn link sm" onClick=${()=>dispatch({type:'TOUR_EXIT'})}>Esci</button></div>`:null}
          ${!tourOn&&st.onb!=null?html`<${Onboarding} i=${st.onb} dispatch=${dispatch}/>`:null}
          ${!tourOn&&st.onb==null&&st.tour.started?html`<button className="card-glass tour-pill hud-btn" onClick=${()=>dispatch({type:'TOUR_RESUME'})}><${Icon} n="play" size=${14}/>Riprendi il tour dal capitolo ${st.tour.step+1}</button>`:null}
        </div>`}
        ${(!tourOn||V!=='twin')&&st.demoOpen?html`<${DemoPanel} sc=${st.sc} now=${now} dispatch=${dispatch} variant="pop"/>`:null}
        <${Toasts} toasts=${st.toasts} snap=${snap} dispatch=${dispatch}/>
      </section>
      ${showSide?html`<aside className="side" aria-label="Dati e dettagli">${side}</aside>`:null}
    </div>
    ${st.modal==='assessment'?html`<${AssessmentModal} dispatch=${dispatch}/>`:null}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
